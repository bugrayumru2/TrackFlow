name: Bug report
description: Report a reproducible TrackFlow problem.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened and what did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Mac/trackpad model, TrackFlow version
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions and settings
      description: Accessibility/Automation status, excluded apps and gesture settings. Do not include private data.
